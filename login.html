<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TransKwanza</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="back-link">
                    <i class="fas fa-arrow-left"></i> Voltar
                </a>
                <div class="logo-large">
                    <i class="fas fa-exchange-alt"></i>
                    <span>TransKwanza</span>
                </div>
                <h1>Entrar na sua conta</h1>
                <p>Bem-vindo de volta!</p>
            </div>

            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i>
                        E-mail
                    </label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        placeholder="seu@email.com"
                        autocomplete="email"
                    >
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        Senha
                    </label>
                    <div class="password-input">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            placeholder="••••••••"
                            autocomplete="current-password"
                        >
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <span>Lembrar de mim</span>
                    </label>
                    <a href="#" class="link-primary">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn-submit">
                    Entrar
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div class="auth-divider">
                <span>ou</span>
            </div>

            <div class="social-login">
                <button class="btn-social btn-google">
                    <i class="fab fa-google"></i>
                    Continuar com Google
                </button>
                <button class="btn-social btn-facebook">
                    <i class="fab fa-facebook"></i>
                    Continuar com Facebook
                </button>
            </div>

            <div class="auth-footer">
                <p>Não tem uma conta? <a href="cadastro.html" class="link-primary">Cadastre-se</a></p>
            </div>

            <!-- Demo credentials info -->
            <div class="demo-info">
                <i class="fas fa-info-circle"></i>
                <div>
                    <strong>Conta Demo:</strong><br>
                    E-mail: demo@transkwanza.com<br>
                    Senha: demo123
                </div>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
