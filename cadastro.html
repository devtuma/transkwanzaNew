<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - TransKwanza</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="back-link">
                    <i class="fas fa-arrow-left"></i> Voltar
                </a>
                <div class="logo-large">
                    <i class="fas fa-exchange-alt"></i>
                    <span>TransKwanza</span>
                </div>
                <h1>Criar sua conta</h1>
                <p>Comece a enviar dinheiro com segurança</p>
            </div>

            <form id="cadastroForm" class="auth-form">
                <div class="form-group">
                    <label for="name">
                        <i class="fas fa-user"></i>
                        Nome completo
                    </label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                        placeholder="Seu nome completo"
                        autocomplete="name"
                    >
                </div>

                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i>
                        E-mail
                    </label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        placeholder="seu@email.com"
                        autocomplete="email"
                    >
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="country">
                            <i class="fas fa-globe"></i>
                            País
                        </label>
                        <select id="country" name="country" required>
                            <option value="">Selecione</option>
                            <option value="BR" data-flag="🇧🇷">🇧🇷 Brasil</option>
                            <option value="AO" data-flag="🇦🇴">🇦🇴 Angola</option>
                            <option value="PT" data-flag="🇵🇹">🇵🇹 Portugal</option>
                            <option value="US" data-flag="🇺🇸">🇺🇸 Estados Unidos</option>
                            <option value="CU" data-flag="🇨🇺">🇨🇺 Cuba</option>
                            <option value="RU" data-flag="🇷🇺">🇷🇺 Rússia</option>
                            <option value="ZA" data-flag="🇿🇦">🇿🇦 África do Sul</option>
                            <option value="NA" data-flag="🇳🇦">🇳🇦 Namíbia</option>
                            <option value="MZ" data-flag="🇲🇿">🇲🇿 Moçambique</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="phone">
                            <i class="fas fa-phone"></i>
                            Telefone
                        </label>
                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            required
                            placeholder="+55 11 99999-9999"
                            autocomplete="tel"
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        Senha
                    </label>
                    <div class="password-input">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            placeholder="Mínimo 6 caracteres"
                            autocomplete="new-password"
                            minlength="6"
                        >
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="password-strength" id="passwordStrength"></div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">
                        <i class="fas fa-lock"></i>
                        Confirmar senha
                    </label>
                    <div class="password-input">
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            required
                            placeholder="Digite a senha novamente"
                            autocomplete="new-password"
                            minlength="6"
                        >
                        <button type="button" class="toggle-password" id="toggleConfirmPassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="acceptTerms" name="acceptTerms" required>
                        <span>Aceito os <a href="termos.html" target="_blank" class="link-primary">Termos de Uso</a> e <a href="privacidade.html" target="_blank" class="link-primary">Política de Privacidade</a></span>
                    </label>
                </div>

                <button type="submit" class="btn-submit">
                    Criar conta
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div class="auth-divider">
                <span>ou</span>
            </div>

            <div class="social-login">
                <button class="btn-social btn-google">
                    <i class="fab fa-google"></i>
                    Continuar com Google
                </button>
                <button class="btn-social btn-facebook">
                    <i class="fab fa-facebook"></i>
                    Continuar com Facebook
                </button>
            </div>

            <div class="auth-footer">
                <p>Já tem uma conta? <a href="login.html" class="link-primary">Entre aqui</a></p>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
